<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>便签</title>
  <style>
    :root { --note:#f9d77e; --ink:#2a2415; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { padding: 10px; color: var(--ink); font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif; background: transparent; }
    .note-window { width: 100%; height: 100%; display: flex; flex-direction: column; border: 1px solid rgba(0,0,0,.16); border-radius: 11px; background: var(--note); box-shadow: 0 15px 35px rgba(0,0,0,.32); }
    .note-bar { height: 38px; padding: 0 9px 0 14px; display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
    .note-title { font-size: 11px; font-weight: 700; opacity: .68; }.note-actions { display: flex; gap: 4px; -webkit-app-region: no-drag; }.note-button { width: 25px; height: 25px; padding: 0; border: 0; border-radius: 6px; color: var(--ink); background: rgba(0,0,0,.08); cursor: pointer; font-size: 15px; line-height: 1; }.note-button:hover { background: rgba(0,0,0,.16); }
    .note-text { flex: 1; width: 100%; padding: 3px 14px 12px; border: 0; outline: 0; resize: none; color: var(--ink); background: transparent; font-size: 15px; line-height: 1.6; }.note-text::placeholder { color: rgba(42,36,21,.42); }
    .note-footer { padding: 7px 14px 11px; display: flex; align-items: center; justify-content: space-between; opacity: .52; font-size: 9px; }.dot { width: 6px; height: 6px; display: inline-block; margin-right: 5px; border-radius: 50%; background: currentColor; }
  </style>
</head>
<body>
  <main class="note-window">
    <header class="note-bar"><span class="note-title">快速便签</span><div class="note-actions"><button class="note-button" id="pinButton" type="button" title="保持置顶">⌃</button><button class="note-button" id="closeButton" type="button" title="关闭便签">×</button></div></header>
    <textarea id="noteText" class="note-text" placeholder="写下此刻的想法..."></textarea>
    <footer class="note-footer"><span><i class="dot"></i>自动保存</span><span id="noteState">已同步</span></footer>
  </main>
  <script src="note.js"></script>
</body>
</html>
